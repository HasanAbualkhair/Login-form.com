<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0", viewport-fit="cover">
    <title>Login form</title>
    <link rel="stylesheet" href="assets/Style.css">
    <link rel="stylesheet" href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css>
</head>

<body>
    
    <form action="#" method="post">
        <div class="form" id="form">
            <h1>Login</h1>
            <div class="input" id="input">
                <input class="info" type="text" placeholder="Email" id="email" required>
            </div>
        <div class="input" id="input">
            <input class="info" type="password" placeholder="Password" id="password" required>
            <i class="fa-solid fa-eye" id="eye"></i>
        </div>

        <div class="remember-me">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Remember me</label>
        </div>
        
        <p id="error-message"></p>
        <a href="javascript:void(0)" class="forgot-password" id="forgot-password" onclick="handleForgotPassword()">Forgot Password?</a>

        <div class="button-box" id="button-box">
          <button type="button" id="login" onclick="handleLogin()">Login</button>
        </div>

    </div>
    </form>

    <script type="module" src="assets/js/javascript.js"></script>


</body>
</html>
